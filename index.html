<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>イガ走</title>
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #gameContainer { position: relative; width: 100%; max-width: 800px; margin: 0 auto; }
        #gameCanvas { display: block; width: 100%; background-color: #87CEEB; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 10; display: none; }
        #audioInitScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #222; display: flex; justify-content: center; align-items: center; z-index: 30; }
        #audioInitBtn { padding: 15px 30px; font-size: 20px; font-weight: bold; color: white; background-color: #1e90ff; border: none; border-radius: 5px; cursor: pointer; }
        #topScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(135, 206, 235, 1); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; display: none; }
        #gameTitle { font-size: 44px; font-weight: bold; color: white; margin-bottom: 12px; text-shadow: 3px 3px 0px #ff4757, 5px 5px 0px rgba(0,0,0,0.2); text-align: center; letter-spacing: 4px; }
        #guideContainer { background-color: rgba(0, 0, 0, 0.4); border-radius: 15px; padding: 12px; margin-bottom: 20px; width: 85%; max-width: 480px; color: white; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .guide-item { display: flex; align-items: center; margin: 6px 0; font-size: 13px; font-weight: bold; }
        .guide-img { width: 28px; height: 28px; margin-right: 15px; object-fit: contain; background-color: rgba(255,255,255,0.2); border-radius: 4px; }
        .guide-text { flex: 1; text-shadow: 1px 1px 2px black; }
        #startBtn { padding: 12px 45px; font-size: 22px; font-weight: bold; color: white; background-color: #ff4757; border: none; border-radius: 50px; box-shadow: 0 6px #ea2027, 0 10px 15px rgba(0,0,0,0.3); cursor: pointer; outline: none; transition: 0.1s; }
        #startBtn:active { box-shadow: 0 2px #ea2027, 0 5px 10px rgba(0,0,0,0.3); transform: translateY(4px); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">SCORE: <span id="score">0</span>m</div>
        <div id="audioInitScreen"><button id="audioInitBtn" disabled style="background-color: #555; cursor: not-allowed;">読み込み中...</button></div>
        <div id="topScreen">
            <div id="gameTitle">イガ走</div>
            <div id="guideContainer">
                <div class="guide-item"><img src="player.png" class="guide-img" alt="🏃‍♂️"><div class="guide-text"><span style="color: #fffa65;">2段ジャンプ</span> ： 2回タップでさらに高く跳べる！</div></div>
                <div class="guide-item"><img src="coin.png" class="guide-img" alt="🪙"><div class="guide-text"><span style="color: #ffd32a;">スパイダー</span> ： ゲットするとスコア +15m！</div></div>
                <div class="guide-item"><img src="enemy1.png" class="guide-img" alt="👾"><div class="guide-text"><span style="color: #ff4d4d;">かずき</span> ： 足場でじっと待ち構えているぞ！</div></div>
                <div class="guide-item"><img src="enemy2.png" class="guide-img" alt="🛸"><div class="guide-text"><span style="color: #9b5de5;">いおり</span> ： フワフワ上下に動いてるぞ！</div></div>
                <div class="guide-item"><img src="enemy3.png" class="guide-img" alt="🏃‍♂️"><div class="guide-text"><span style="color: #00f5d4;">せいや</span> ： 近づくと加速して突進してくるぞ！</div></div>
                <div class="guide-item"><img src="enemy4.png" class="guide-img" alt="👹"><div class="guide-text"><span style="color: #f15bb5;">そうた</span> ： スコア100m以降に出現する超強敵！</div></div>
            </div>
            <button id="startBtn">走れ!!</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        // 💡 対策：Firebaseのダウンロードを完全に1つずつ順番に待ちます
        function loadScript(url, callback) {
            var script = document.createElement("script");
            script.src = url;
            script.onload = callback;
            document.head.appendChild(script);
        }

        loadScript("https://gstatic.com", function() {
            loadScript("https://gstatic.com", function() {
                loadScript("main.js", function() {
                    // 全てのファイルが完璧に読み込み終わったら、ボタンを「ゲームを読み込む」に変えて有効化
                    var btn = document.getElementById("audioInitBtn");
                    btn.innerText = "ゲームを読み込む";
                    btn.style.backgroundColor = "#1e90ff";
                    btn.style.cursor = "pointer";
                    btn.disabled = false;
                });
            });
        });
    </script>
</body>
</html>
