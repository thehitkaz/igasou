<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>イガ走</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            background-color: #87CEEB;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 10;
            display: none;
        }
        /* 共通の画面オーバーレイ（トップ・オーディオ画面） */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #87CEEB;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #topScreen {
            display: none; /* 最初はオーディオ画面を出すため非表示 */
        }
        .screen-title {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #ff4757, 5px 5px 0px rgba(0,0,0,0.2);
            text-align: center;
        }
        .action-btn {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #ff4757;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px #ea2027, 0 10px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
            transition: 0.1s;
        }
        .action-btn:active {
            box-shadow: 0 2px #ea2027, 0 5px 10px rgba(0,0,0,0.3);
            transform: translateY(4px);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <!-- スコア表示 -->
        <div id="ui">SCORE: <span id="score">0</span>m</div>
        
        <!-- 🔊 ブラウザの音声再生制限を解除するための初期画面 -->
        <div id="audioInitScreen" class="screen-overlay" style="width: 100%; height: 100%;">
            <div class="screen-title">音声の有効化</div>
            <button id="audioInitBtn" class="action-btn">ゲームを読み込む</button>
        </div>

        <!-- 🏠 タイトル画面 -->
        <div id="topScreen" class="screen-overlay">
            <div id="gameTitle" class="screen-title">イガ走</div>
            <button id="startBtn" class="action-btn">走れ!!</button>
        </div>
        
        <!-- ゲーム描画キャンバス -->
        <canvas id="gameCanvas"></canvas>
    </div>
    
    <!-- ⚠️ Firebase関連の script タグはすべて削除しました -->
    <script src="main.js"></script>
</body>
</html>
